<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset='utf-8' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js'></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: transparent; }
    #calendar { max-width: 100%; background: white; padding: 15px; border-radius: 12px; border: 1px solid #e0e0e0; }
    
    /* Cabecera del calendario con tu color verde */
    .fc-theme-standard .fc-toolbar-title { color: #4F7942; font-size: 1.4em; }
    .fc .fc-button-primary { background-color: #4F7942 !important; border-color: #4F7942 !important; }
    .fc .fc-button-primary:disabled { background-color: #8da785 !important; }

    /* Estilo para los días OCUPADOS (Sincronizados de Booking) */
    .fc-event { 
        background-color: #d9534f !important; /* Rojo suave para ocupado */
        border: none !important; 
        color: white !important; 
        text-align: center;
        font-weight: bold;
    }
    /* Estilo para los días del calendario */
    .fc-daygrid-day-number { color: #333; text-decoration: none; padding: 5px !important; }
    .fc-col-header-cell-cushion { color: #4F7942; text-decoration: none; }
  </style>
</head>
<body>
  <div id='calendar'></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ca', // Puesto en Catalán como tu web
        firstDay: 1,  // Semana empieza en Lunes
        headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
        events: {
          // REEMPLAZA ESTA URL POR TU ENLACE .ICS DE BOOKING
          url: 'https://corsproxy.io/?' + encodeURIComponent('https://ical.booking.com/v1/export?t=43cb68dd-d0fd-4603-8cad-f937def8f76e'),
          format: 'ics'
        },
        eventContent: function(arg) {
          return { html: '<b>OCUPAT</b>' }; // Ocupat
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
