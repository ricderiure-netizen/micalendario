<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js'></script>

  <style>
    body { font-family: sans-serif; margin: 0; background-color: transparent; }
    #calendar { 
      max-width: 900px; 
      margin: 10px auto;
      background: white; 
      padding: 10px; 
      border-radius: 12px; 
      border: 1px solid #e0e0e0;
    }
    
    /* Colores personalizados */
    .fc-theme-standard .fc-toolbar-title { color: #4F7942; font-size: 1.2em; }
    .fc .fc-button-primary { background-color: #4F7942 !important; border: none !important; }
    
    /* Estilo OCUPADO */
    .event-ocupado {
      background-color: #d9534f !important;
      border: none !important;
      color: white !important;
      text-align: center;
      font-weight: bold;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ajuste para móviles: que el calendario no sea demasiado alto */
    @media (max-width: 600px) {
      .fc-toolbar { flex-direction: column; gap: 5px; }
      .fc-toolbar-title { font-size: 1em !important; }
    }
  </style>
</head>
<body>

  <div id='calendar'></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ca',
        firstDay: 1,
        height: 'auto', // Ayuda en móviles a que no se desborde
        headerToolbar: { 
          left: 'prev,next', 
          center: 'title', 
          right: 'today' 
        },
        events: {
          // Llamamos a TU propio servidor, no a un proxy externo
          url: 'booking_proxy.php', 
          format: 'ics',
          className: 'event-ocupado'
        },
        eventContent: function(arg) {
          return { html: '<b>OCUPAT</b>' };
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
